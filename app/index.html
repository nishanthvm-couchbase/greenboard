<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="">
    <meta name="author" content="">
    <link rel="icon" href="../../favicon.ico">

    <title>Greenboard</title>

    <!-- Bootstrap core CSS -->
    <link href="bower_components/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="bower_components/font-awesome/css/font-awesome.min.css" rel="stylesheet" />
    
    <!-- Preconnect to CDN for faster loading -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <!-- Font Awesome 5 for moon/sun icons (slider only) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" integrity="sha512-1ycn6IcaQQ40/MKBW2W4Rhis/DbILU74C1vSrLJxCq57o941Ym01SwNsOMqvEBFlcgUa6xLiPY/NS5R+E6ztJQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Custom styles for this template -->
    <link href="css/app.css?v=20260124b" rel="stylesheet">

  </head>

  <body ng-app="greenBoard">

  <div class="navbar navbar-inverse navbar-fixed-top" role="navigation">
    <div class="container-fluid">
      <div class="navbar-header">
        <button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target=".navbar-collapse">
          <span class="sr-only">Toggle navigation</span>
          <span class="icon-bar"></span>
          <span class="icon-bar"></span>
          <span class="icon-bar"></span>
        </button>
        <a class="navbar-brand" href="/">Greenboard</a>
      </div>
      <div class="navbar-collapse collapse">
        <ul class="nav navbar-nav navbar-right">
        </ul>

      </div>
    </div>
  </div>


  <!-- TODO: some kind of spinner while resolving builds -->
  <div ui-view></div>
  
  <!-- Views Modals -->
  <!-- Save View Modal -->
  <div class="modal fade" id="saveViewModal" tabindex="-1" role="dialog" aria-labelledby="saveViewModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
          <h4 class="modal-title" id="saveViewModalTitle">Save Current View</h4>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label for="viewNameInput">View Name:</label>
            <input type="text" class="form-control" id="viewNameInput" ng-model="$root.newViewName" placeholder="Enter view name" ng-keypress="$event.keyCode === 13 && viewsCtrl.saveCurrentView()">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-default" data-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" ng-click="viewsCtrl.saveCurrentView()">Save View</button>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Share View Modal -->
  <div class="modal fade" id="shareViewModal" tabindex="-1" role="dialog" aria-labelledby="shareViewModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
          <h4 class="modal-title" id="shareViewModalTitle">Share View</h4>
        </div>
        <div class="modal-body">
          <p>Select a view to share:</p>
          <div class="form-group" ng-if="shareViewList && shareViewList.length > 0">
            <select class="form-control" ng-model="$root.selectedShareView" ng-change="viewsCtrl.selectViewToShare($root.selectedShareView)">
              <option value="">-- Select a view --</option>
              <option ng-repeat="view in $root.shareViewList" value="{{view.id}}">{{view.name}}</option>
            </select>
          </div>
          <div ng-if="!$root.shareViewList || $root.shareViewList.length === 0" class="alert alert-info">
            No views available to share. Save a view first.
          </div>
          <div ng-if="$root.selectedShareView && $root.shareCode">
            <div class="form-group">
              <label>Share Code:</label>
              <div class="input-group">
                <input type="text" class="form-control" id="shareCodeInput" ng-value="$root.shareCode" readonly>
                <span class="input-group-btn">
                  <button class="btn btn-default" type="button" ng-click="viewsCtrl.copyShareCode()">
                    <i class="fa fa-copy"></i> Copy
                  </button>
                </span>
              </div>
            </div>
            <div class="form-group">
              <label>Share URL:</label>
              <div class="input-group">
                <input type="text" class="form-control" id="shareUrlInput" ng-value="$root.shareUrl" readonly>
                <span class="input-group-btn">
                  <button class="btn btn-default" type="button" ng-click="viewsCtrl.copyShareUrl()">
                    <i class="fa fa-copy"></i> Copy
                  </button>
                </span>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Import View Modal -->
  <div class="modal fade" id="importViewModal" tabindex="-1" role="dialog" aria-labelledby="importViewModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
          <h4 class="modal-title" id="importViewModalTitle">Import View</h4>
        </div>
        <div class="modal-body">
          <p>Paste a view code or URL to import:</p>
          <div class="form-group">
            <label for="importCodeInput">View Code or URL:</label>
            <input type="text" class="form-control" id="importCodeInput" ng-model="$root.importCode" placeholder="Paste view code or URL here" ng-keypress="$event.keyCode === 13 && viewsCtrl.importView()">
            <small class="help-block">You can paste either the share code or the full share URL</small>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-default" data-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" ng-click="viewsCtrl.importView()">Import View</button>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Toast Notification -->
  <div class="toast-notification" ng-class="{'show': toast && toast.show, 'error': toast && toast.isError}" ng-if="toast">
    <span>{{toast.message}}</span>
  </div>
  
  <!-- Bootstrap core JavaScript
  ================================================== -->
  <!-- Placed at the end of the document so the pages load faster -->
  <script src="bower_components/jquery/dist/jquery.min.js"></script>
  <script src="bower_components/bootstrap/dist/js/bootstrap.min.js"></script>

  <!-- lodash -->
  <script src="bower_components/lodash/dist/lodash.min.js"></script>

  <!-- angular -->
  <script src="bower_components/angular/angular.min.js"></script>
  <script src="bower_components/angular-ui-router/release/angular-ui-router.min.js"></script>
  <script src="bower_components/angular-resource/angular-resource.min.js"></script>
  <script src="bower_components/angular-sanitize/angular-sanitize.min.js"></script>
  <script src="bower_components/angular-animate/angular-animate.min.js"></script>

  <!-- plotly -->
  <script src="bower_components/d3/d3.min.js"></script>
  <script src="js/d3-tip-compat.js"></script>

  <script src="bower_components/angular-google-chart/ng-google-chart.min.js" ></script>


   <!-- user scripts -->
   <script src="dist/greenboard.min.js?v=20260124u"></script>

  <!-- For debugging, comment above and uncomment below -->
  <!-- <script src="dist/greenboard.js"></script> -->

  </body>
</html>
