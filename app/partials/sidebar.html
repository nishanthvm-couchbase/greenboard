  <!-- builds module -->
  <div class="nav nav-sidebar">
    <div class="nav-header">
        <h3>Build</h3>
        <span class="percToggle">
          <i class="fa"
             ng-class="{'fa-toggle-on': !showPerc, 'fa-toggle-off': showPerc}" 
             ng-click="showPerc=!showPerc"></i>
        </span>
    </div>
        <sidebar-item key="{{buildVersion}}" type="build" show-perc="showPerc" />
  </div>

  <!-- Compare Builds Card -->
  <a href="/compare-builds" target="_blank" class="compare-builds-card">
    <i class="fa fa-exchange"></i>
    <span>Compare Builds</span>
  </a>

  <div ng-if="sidebarItems.serverVersions && sidebarItems.serverVersions[0] != null" class="nav nav-sidebar">
    <div class="nav-header">
      <h3>CB Server Versions</h3>
      <a ng-click="toggleAll('serverVersions')" href="">
        <i class="fa" ng-class="{'fa-check-square-o': !disabled.serverVersions, 'fa-square-o': disabled.serverVersions}"></i> all
      </a>
    </div>
    <div ng-repeat="key in sidebarItems.serverVersions">
      <sidebar-item key="{{key}}" type="serverVersions" show-perc="showPerc"/>
    </div>
  </div>

  <div ng-if="sidebarItems.dapiVersions && sidebarItems.dapiVersions[0] != null" class="nav nav-sidebar">
    <div class="nav-header">
      <h3>DAPI Versions</h3>
      <a ng-click="toggleAll('dapiVersions')" href="">
        <i class="fa" ng-class="{'fa-check-square-o': !disabled.dapiVersions, 'fa-square-o': disabled.dapiVersions}"></i> all
      </a>
    </div>
    <div ng-repeat="key in sidebarItems.dapiVersions">
      <sidebar-item key="{{key}}" type="dapiVersions" show-perc="showPerc"/>
    </div>
  </div>

  <div ng-if="sidebarItems.nebulaVersions && sidebarItems.nebulaVersions[0] != null" class="nav nav-sidebar">
    <div class="nav-header">
      <h3>Direct Nebula Versions</h3>
      <a ng-click="toggleAll('nebulaVersions')" href="">
        <i class="fa" ng-class="{'fa-check-square-o': !disabled.nebulaVersions, 'fa-square-o': disabled.nebulaVersions}"></i> all
      </a>
    </div>
    <div ng-repeat="key in sidebarItems.nebulaVersions">
      <sidebar-item key="{{key}}" type="nebulaVersions" show-perc="showPerc"/>
    </div>
  </div>

  <div ng-if="sidebarItems.envVersions && sidebarItems.envVersions[0] != null" class="nav nav-sidebar">
    <div class="nav-header">
      <h3>Environment</h3>
      <a ng-click="toggleAll('envVersions')" href="">
        <i class="fa" ng-class="{'fa-check-square-o': !disabled.envVersions, 'fa-square-o': disabled.envVersions}"></i> all
      </a>
    </div>
    <div ng-repeat="key in sidebarItems.envVersions">
      <sidebar-item key="{{key}}" type="envVersions" show-perc="showPerc"/>
    </div>
  </div>

  <!-- platforms -->
  <div class="nav nav-sidebar">
    <div class="nav-header">
      <h3>Platforms</h3>
      <a ng-click="toggleAll('platforms')" href="">
          <i class="fa" ng-class="{'fa-check-square-o': !disabled.platforms, 'fa-square-o': disabled.platforms}"></i> all
      </a>
    </div>
    <div ng-repeat="key in sidebarItems.platforms | orderBy:key">
      <sidebar-item key="{{key}}" type="platforms"  show-perc="showPerc" />
    </div>
  </div>

  <!-- variants -->
  <div ng-repeat="variant in sidebarItemsVariants">
    <div ng-if="targetBy === 'server'" class="nav nav-sidebar">
      <div class="nav-header">
          <h3>{{ variantName(variant) }}</h3>
          <a ng-click="toggleAll(variant)" href="">
            <i class="fa" ng-class="{'fa-check-square-o': !disabled[variant], 'fa-square-o': disabled[variant]}"></i> all
          </a>
      </div>
      <div ng-repeat="key in sidebarItems[variant] | orderBy:key">
        <sidebar-item key="{{key}}" type="{{variant}}"  show-perc="showPerc" />
      </div>
    </div>
  </div>

  <!-- features -->
  <div class="nav nav-sidebar">
    <div class="nav-header">
      <div ng-if="targetBy !== 'operator'">
        <h3>Features</h3>
      </div>
      <dif ng-if="targetBy === 'operator'">
        <h3>Kubernetes version</h3>
      </dif>
      <span class="header-controls">
        <a ng-click="toggleAll('features')" href="" title="Select/Deselect All">
            <i class="fa" ng-class="{'fa-check-square-o': !disabled.features, 'fa-square-o': disabled.features}"></i> all
        </a>
        <span class="reverse-toggle" ng-click="toggleReverseMode('features')" title="{{reverseMode.features ? 'Exclude Mode: Click to deselect items' : 'Include Mode: Click to select items'}}">
            <i class="fa" ng-class="{'fa-minus-circle': reverseMode.features, 'fa-plus-circle': !reverseMode.features}"></i>
        </span>
        <span class="low-runrate-wrapper">
          <span class="low-runrate-toggle"
                ng-class="{'active': featureThresholdFilter.enabled, 'open': featureThresholdPopoverOpen}"
                ng-click="toggleFeatureThresholdPopover($event)"
                title="{{featureThresholdFilter.enabled ? 'Feature filter enabled' : 'Filter features'}}">
              <i class="fa fa-filter"></i>
          </span>
        </span>
      </span>
    </div>

    <!-- Inline feature filter panel (inside Features section) -->
    <div class="feature-filter-panel" ng-if="featureThresholdPopoverOpen" ng-click="$event.stopPropagation()">
      <div class="feature-filter-panel-header">
        <div class="ffp-title">Feature filter</div>
        <button type="button" class="ffp-close" ng-click="closeFeatureThresholdPopover()" aria-label="Close">&times;</button>
      </div>

      <div class="ffp-row">
        <label class="ffp-label">Metric</label>
        <select class="ffp-select" ng-model="featureThresholdFilter.metric"
                ng-options="opt.value as opt.label for opt in featureThresholdMetricOptions">
        </select>
      </div>

      <div class="ffp-row">
        <label class="ffp-label">Threshold</label>
        <div class="ffp-input-row">
          <input type="number"
                 class="ffp-input"
                 ng-model="featureThresholdFilter.value"
                 ng-attr-min="{{featureThresholdFilter.metric === 'fail_count' ? 0 : 0}}"
                 ng-attr-max="{{featureThresholdFilter.metric === 'fail_count' ? 999999 : 100}}"
                 placeholder="{{featureThresholdFilter.metric === 'fail_count' ? 'e.g. 40' : 'e.g. 10'}}">
          <span class="ffp-suffix" ng-bind="getFeatureThresholdSuffix()"></span>
        </div>
      </div>

      <div class="ffp-actions">
        <button class="btn btn-xs btn-primary" ng-click="applyFeatureThresholdFilter()">Apply</button>
        <button class="btn btn-xs btn-default" ng-click="clearFeatureThresholdFilter()">Clear</button>
      </div>
    </div>

    <div ng-repeat="key in getFilteredFeatures() | orderBy:key">
      <sidebar-item key="{{key}}" type="features" show-perc="showPerc" reverse-mode="reverseMode.features" />
    </div>
  </div>
